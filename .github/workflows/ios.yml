name: iOS Build & Test

on:
  push:
    branches: [ "codex/wallet-milestone1" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Run Tests
        run: |
          xcodebuild test \
            -project WALLET.xcodeproj \
            -scheme WALLET \
            -destination 'platform=iOS Simulator,name=iPhone 15'
